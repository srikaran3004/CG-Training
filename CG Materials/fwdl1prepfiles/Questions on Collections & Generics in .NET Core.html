  if (questions.length !== 100) console.warn("Generated only", questions.length, "questions, need fix");
  // final safety: add dummy if miscount (but our counts accurate)
  while(questions.length < 100) questions.push({ text: "Additional Q: explain generics caching", level:"intermediate", answer:"Every closed generic type is unique at runtime."});

  // DOM elements
  const container = document.getElementById('questionsContainer');
  const statsSpan = document.getElementById('statsDisplay');
  let currentLevel = 'all';

  function renderCards() {
    const filtered = currentLevel === 'all' ? questions : questions.filter(q => q.level === currentLevel);
    statsSpan.innerText = `Showing ${filtered.length} of ${questions.length} questions (${currentLevel === 'all' ? 'all levels' : currentLevel})`;
    container.innerHTML = '';
    filtered.forEach((q, idx) => {
      const card = document.createElement('div');
      card.className = 'question-card';
      const originalIndex = questions.findIndex(orig => orig.text === q.text && orig.level === q.level);
      const displayNumber = originalIndex + 1;
      card.innerHTML = `
        <div class="question-header">
          <span class="q-num">#${displayNumber}</span>
          <span class="difficulty ${q.level}">${q.level}</span>
        </div>
        <div class="question-text">${escapeHtml(q.text)}</div>
        <button class="answer-toggle" data-idx="${originalIndex}">🔍 Show answer</button>
        <div class="answer-content" data-answer-idx="${originalIndex}">
          <p>${escapeHtml(q.answer)}</p>
        </div>
      `;
      container.appendChild(card);
    });
    // attach toggle events
    document.querySelectorAll('.answer-toggle').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const idxAttr = btn.getAttribute('data-idx');
        const answerDiv = document.querySelector(`.answer-content[data-answer-idx="${idxAttr}"]`);
        if (answerDiv) {
          answerDiv.classList.toggle('show');
          btn.textContent = answerDiv.classList.contains('show') ? "📖 Hide answer" : "🔍 Show answer";
        }
      });
    });
  }

  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
      return c;
    });
  }

  function setActiveFilter(level) {
    document.querySelectorAll('.filter-btn').forEach(btn => {
      if (btn.getAttribute('data-level') === level) btn.classList.add('active');
      else btn.classList.remove('active');
    });
    currentLevel = level;
    renderCards();
  }

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      setActiveFilter(btn.getAttribute('data-level'));
    });
  });

  renderCards();
</script>
</body>
</html>
