<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Hostel Management UI</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; background-color: #f8f9fa; }
        .card { margin-bottom: 20px; }
        .table-responsive { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center text-primary mb-4">🎓 Student & Hostel Management Portal</h2>

        <!-- Form for Creating/Updating Student -->
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0" id="formTitle">Add New Student</h5>
            </div>
            <div class="card-body">
                <form id="studentForm">
                    <input type="hidden" id="studentId">
                    
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Student Name</label>
                            <input type="text" id="name" class="form-control" required placeholder="John Doe">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="email" class="form-control" required placeholder="john@example.com">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Course</label>
                            <input type="text" id="course" class="form-control" required placeholder="B.Tech Computer Science">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Hostel Room Number</label>
                            <input type="text" id="roomNumber" class="form-control" required placeholder="A-101">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Hostel Block</label>
                            <input type="text" id="block" class="form-control" required placeholder="Block A">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100" id="saveBtn">Save Student Details</button>
                    <button type="button" class="btn btn-secondary w-100 mt-2 d-none" id="cancelBtn" onclick="resetForm()">Cancel Update</button>
                </form>
            </div>
        </div>

        <!-- Table displaying Students -->
        <div class="table-responsive">
            <h5 class="mb-3 text-secondary">Registered Students & Hostel Details</h5>
            <table class="table table-hover table-bordered text-center align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th>Room No</th>
                        <th>Block</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">
                    <!-- Data will be populated here via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = '/api/student'; // Assuming frontend runs on same domain since it's served from wwwroot

        document.addEventListener("DOMContentLoaded", loadStudents);
        document.getElementById("studentForm").addEventListener("submit", handleFormSubmit);

        // Fetch and display all students
        async function loadStudents() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Failed to fetch data');
                const students = await response.json();
                
                const tableBody = document.getElementById("studentTableBody");
                tableBody.innerHTML = ""; // Clear existing rows

                students.forEach(student => {
                    const row = `
                        <tr>
                            <td>${student.studentId}</td>
                            <td>${student.name}</td>
                            <td>${student.email}</td>
                            <td><span class="badge bg-info text-dark">${student.course}</span></td>
                            <td>${student.roomNumber}</td>
                            <td>${student.block}</td>
                            <td>
                                <button class="btn btn-sm btn-warning me-1" onclick='editStudent(${JSON.stringify(student)})'>Edit</button>
                                <button class="btn btn-sm btn-danger" onclick='deleteStudent(${student.studentId})'>Delete</button>
                            </td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            } catch (error) {
                console.error("Error loading students:", error);
                alert("Failed to load students. See console for details.");
            }
        }

        // Handle Add or Update Submission
        async function handleFormSubmit(e) {
            e.preventDefault();

            const studentId = document.getElementById("studentId").value;
            const studentData = {
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                course: document.getElementById("course").value,
                roomNumber: document.getElementById("roomNumber").value,
                block: document.getElementById("block").value
            };

            const method = studentId ? 'PUT' : 'POST';
            const url = studentId ? `${API_URL}/${studentId}` : API_URL;

            // If updating, include the StudentId in payload
            if (studentId) {
                studentData.studentId = parseInt(studentId);
            }

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(studentData)
                });

                if (!response.ok) {
                    const errorResponse = await response.text();
                    throw new Error(errorResponse || 'Operation failed');
                }

                alert(studentId ? "Student updated successfully!" : "Student created successfully!");
                resetForm();
                loadStudents(); // Reload table
            } catch (error) {
                console.error("Error saving student:", error);
                alert("Error saving student: " + error.message);
            }
        }

        // Populate form for Edit
        function editStudent(student) {
            document.getElementById("formTitle").innerText = "Update Student";
            document.getElementById("saveBtn").innerText = "Update Details";
            document.getElementById("saveBtn").classList.replace("btn-success", "btn-warning");
            document.getElementById("cancelBtn").classList.remove("d-none"); // Show Cancel button

            document.getElementById("studentId").value = student.studentId;
            document.getElementById("name").value = student.name;
            document.getElementById("email").value = student.email;
            document.getElementById("course").value = student.course;
            document.getElementById("roomNumber").value = student.roomNumber;
            document.getElementById("block").value = student.block;
            
            window.scrollTo(0,0);
        }

        // Reset the form
        function resetForm() {
            document.getElementById("studentForm").reset();
            document.getElementById("studentId").value = "";
            document.getElementById("formTitle").innerText = "Add New Student";
            document.getElementById("saveBtn").innerText = "Save Student Details";
            document.getElementById("saveBtn").classList.replace("btn-warning", "btn-success");
            document.getElementById("cancelBtn").classList.add("d-none"); // Hide Cancel button
        }

        // Delete Student
        async function deleteStudent(id) {
            if (!confirm("Are you sure you want to delete this student and their hostel record?")) return;

            try {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });

                if (response.ok) {
                    alert("Student deleted successfully!");
                    loadStudents(); // Reload table
                } else {
                    const errorResponse = await response.text();
                    throw new Error(errorResponse || 'Delete failed');
                }
            } catch (error) {
                console.error("Error deleting student:", error);
                alert("Error deleting student: " + error.message);
            }
        }
    </script>
</body>
</html>
